[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_17001E000F51313531383332-if00

[virtual_sdcard]
path: /home/adam/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 100
max_accel: 500
max_z_velocity: 5
max_z_accel: 50
square_corner_velocity: 3

# Clockwork 2 extruder on Motor6
[extruder]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.4
filament_diameter: 1.75

heater_pin: PF6
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PB1
control: watermark
max_delta: 2
max_power: 0.3
min_temp: 0
max_temp: 170
min_extrude_temp: 170

[tmc2209 extruder]
uart_pin: PG9
run_current: 0.5
interpolate: false
stealthchop_threshold: 0

# Bed thermistor connected to TH0
[heater_bed]
heater_pin: PF5
sensor_type: Generic 3950
sensor_pin: PB0
control: watermark
max_delta: 2
max_power: 0.3
min_temp: 0
max_temp: 100

# Motor1: B motor, rear left
[stepper_x]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PE6
microsteps: 32
rotation_distance: 40
endstop_pin: ^PF0
position_endstop: 300
position_min: 0
position_max: 300
homing_speed: 20
homing_retract_dist: 5
homing_positive_dir: true
full_steps_per_rotation: 400

[tmc2209 stepper_x]
uart_pin: PG14
run_current: 0.8
interpolate: false
stealthchop_threshold: 0

# Motor2: A motor, rear right
[stepper_y]
step_pin: PE4
dir_pin: !PE5
enable_pin: !PE3
microsteps: 32
rotation_distance: 40
endstop_pin: ^PF2
position_endstop: 300
position_min: 0
position_max: 300
homing_speed: 20
homing_retract_dist: 5
homing_positive_dir: true
full_steps_per_rotation: 400

[tmc2209 stepper_y]
uart_pin: PG13
run_current: 0.8
interpolate: false
stealthchop_threshold: 0

# Motor3: front-left Z
[stepper_z]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
microsteps: 32
rotation_distance: 4
endstop_pin: ^PF4
position_min: -3
position_max: 250
homing_speed: 3
second_homing_speed: 1
homing_retract_dist: 3
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: PG12
run_current: 0.6
interpolate: false
stealthchop_threshold: 0

# Motor4: rear Z
[stepper_z1]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7
microsteps: 32
rotation_distance: 4

[tmc2209 stepper_z1]
uart_pin: PG11
run_current: 0.6
interpolate: false
stealthchop_threshold: 0

# Motor5: front-right Z
[stepper_z2]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
microsteps: 32
rotation_distance: 4

[tmc2209 stepper_z2]
uart_pin: PG10
run_current: 0.6
interpolate: false
stealthchop_threshold: 0

[safe_z_home]
home_xy_position: 168, 298
speed: 50
z_hop: 0

[z_tilt]
z_positions:
    -66, 11
    150, 352
    366, 11
points:
    30, 5
    150, 245
    270, 5
speed: 50
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.01

# BTT Mini12864 via Octopus MAX EZ LCD flat cable
[display]
lcd_type: uc1701
cs_pin: PD14
a0_pin: PD13
rst_pin: PD12
contrast: 63
encoder_pins: ^PG4, ^PG5
click_pin: ^!PD15
spi_software_miso_pin: PE13
spi_software_mosi_pin: PE14
spi_software_sclk_pin: PE12

[neopixel mini12864]
pin: PD11
chain_count: 3
color_order: RGB
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4

# Part cooling fan
[fan]
pin: PA6
kick_start_time: 0.5

[heater_fan hotend_fan]
pin: PA5
heater: extruder
heater_temp: 40
fan_speed: 1.0
kick_start_time: 0.5

[controller_fan electronics_fans]
pin: PA4
kick_start_time: 0.5
fan_speed: 1.0
idle_speed: 1.0
idle_timeout: 60
heater: heater_bed, extruder

[probe]
pin: PF11
x_offset: 0
y_offset: 25
#z_offset: 0
samples: 1
speed: 2
sample_retract_dist: 3

# Stealthburner RGBW LEDs connected to RGB1
[neopixel sb_leds]
pin: PE10
chain_count: 3
color_order: GRBW
initial_RED: 0.3
initial_GREEN: 0.0
initial_BLUE: 0.3
initial_WHITE: 0.0

[output_pin chamber_light]
pin: PA3
pwm: True
cycle_time: 0.01
value: 1.0
shutdown_value: 0

